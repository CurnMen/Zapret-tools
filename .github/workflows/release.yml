name: Release

on:
  push:
    tags:
      - 'Zapret-Tools-V*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm install

      # Версия артефактов берётся из package.json, а не из тега.
      # Расхождение не ломает сборку, но делает latest.json не тем, что ждёшь.
      - name: Version sanity check
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = '${{ github.ref_name }}'
          Write-Host "tag=$tag version=$version"
          if ($tag -notmatch [regex]::Escape($version)) {
            Write-Warning "Tag $tag does not contain version $version from package.json"
          }

      # tauri-action собирает NSIS, подписывает артефакты ключом из секретов
      # и публикует релиз вместе с latest.json для tauri-plugin-updater.
      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: 'Сборка из тега ${{ github.ref_name }}.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
