name: Release

on:
  push:
    tags:
      - 'Zapret-Tools-V*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm install

      # Версия артефактов берётся из package.json, а не из тега.
      # Расхождение не ломает сборку, но делает latest.json не тем, что ждёшь.
      - name: Version sanity check
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = '${{ github.ref_name }}'
          Write-Host "tag=$tag version=$version"
          if ($tag -notmatch [regex]::Escape($version)) {
            Write-Warning "Tag $tag does not contain version $version from package.json"
          }

      # Файл из `tauri signer generate -w` хранится в base64, а сам ключ — это две
      # строки, первая из которых `untrusted comment:`. Принимаем оба вида,
      # иначе tauri падает с «Missing comment in secret key».
      - name: Prepare updater signing key
        shell: pwsh
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RAW_KEY)) {
            throw "Secret TAURI_SIGNING_PRIVATE_KEY is not set"
          }
          if ($env:RAW_KEY -match 'untrusted comment') {
            $key = $env:RAW_KEY
          } else {
            $key = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:RAW_KEY))
          }
          $path = Join-Path $env:RUNNER_TEMP 'updater.key'
          [IO.File]::WriteAllText($path, $key.Trim() + "`n", [Text.UTF8Encoding]::new($false))
          Write-Host "Signing key prepared"

      # tauri-action собирает NSIS, подписывает артефакты ключом из секретов
      # и публикует релиз вместе с latest.json для tauri-plugin-updater.
      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}\updater.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: 'Сборка из тега ${{ github.ref_name }}.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
