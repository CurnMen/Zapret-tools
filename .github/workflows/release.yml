name: Release

on:
  push:
    tags:
      - 'Zapret-Tools-V*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm install

      # Версия артефактов берётся из package.json, а не из тега.
      # Расхождение не ломает сборку, но делает latest.json не тем, что ждёшь.
      - name: Version sanity check
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = '${{ github.ref_name }}'
          Write-Host "tag=$tag version=$version"
          if ($tag -notmatch [regex]::Escape($version)) {
            Write-Warning "Tag $tag does not contain version $version from package.json"
          }

      # Tauri ждёт ключ в base64 (именно так его пишет `tauri signer generate -w`)
      # и сам декодирует строку. Поэтому текстовый ключ здесь переводим в base64:
      # с текстом сборка падает на «Invalid symbol 32, offset 9».
      - name: Prepare updater signing key
        shell: pwsh
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RAW_KEY)) {
            throw "Secret TAURI_SIGNING_PRIVATE_KEY is not set"
          }
          $raw = $env:RAW_KEY.Trim()
          if ($raw -match 'untrusted comment') {
            $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($raw + "`n"))
            Write-Host "Signing key: текстовый ключ переведён в base64"
          } else {
            try { [void][Convert]::FromBase64String($raw) }
            catch { throw "Secret TAURI_SIGNING_PRIVATE_KEY is not valid base64" }
            $b64 = $raw
            Write-Host "Signing key: base64 уже на месте"
          }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "TAURI_SIGNING_PRIVATE_KEY=$b64`n", [Text.UTF8Encoding]::new($false))

      # tauri-action собирает NSIS, подписывает артефакты ключом из секретов
      # и публикует релиз вместе с latest.json для tauri-plugin-updater.
      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: 'Сборка из тега ${{ github.ref_name }}.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
      # tauri-action заливает инсталлятор и latest.json, портативный exe — отдельно.
      - name: Upload portable exe
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" "src-tauri/target/release/zapret-tools.exe" --clobber
