<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zapret Tools</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1e1e2e; color: #cdd6f4; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; padding: 24px; }
  .container { max-width: 1200px; margin: 0 auto; background: #313244; border-radius: 16px; padding: 24px; box-shadow: 0 12px 30px rgba(0,0,0,0.5); }
  h1 { font-size: 1.6rem; color: #f5c2e7; margin-bottom: 4px; }
  .sub { color: #a6adc8; font-size: 0.88rem; margin-bottom: 20px; }
  
  .root-bar, .running-bar, .filter-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 16px; margin-bottom: 20px; background: #45475a; border-radius: 12px; border: 2px solid transparent; }
  .root-bar.connected { border-color: #a6e3a1; }
  .running-bar { border-color: #89b4fa; }
  .filter-bar { border-color: #a6e3a1; justify-content: space-between; }
  
  .root-bar .status, .running-bar .status, .filter-bar .status { flex: 1; min-width: 200px; font-size: 0.9rem; color: #bac2de; }
  .root-bar .status strong { color: #a6e3a1; }
  .badge { background: #a6e3a1; color: #1e1e2e; padding: 4px 10px; border-radius: 20px; font-size: 0.78rem; font-weight: bold; }

  .tabs { display: flex; gap: 6px; margin-bottom: 22px; background: #1e1e2e; padding: 6px; border-radius: 12px; flex-wrap: wrap; }
  .tab { flex: 1 1 auto; padding: 12px 16px; border: none; cursor: pointer; background: transparent; color: #a6adc8; font-size: 0.95rem; font-weight: 600; border-radius: 8px; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .tab:hover { color: #cdd6f4; background: #313244; }
  .tab.active { background: #cba6f7; color: #1e1e2e; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  button { background: #cba6f7; color: #1e1e2e; border: none; padding: 10px 18px; border-radius: 10px; font-weight: bold; cursor: pointer; transition: background 0.2s; font-size: 0.95rem; }
  button:hover { background: #b4befe; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary { background: #585b70; color: #cdd6f4; }
  button.secondary:hover { background: #6c7086; }
  button.big { width: 100%; padding: 14px; font-size: 1.05rem; margin-top: 12px; }
  button.danger { background: #f38ba8; color: #1e1e2e; }
  button.danger:hover { background: #eba0ac; }
  button.small { padding: 6px 12px; font-size: 0.82rem; }

  .quick-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .btn-icon { padding: 6px 12px; font-size: 0.82rem; background: #585b70; color: #cdd6f4; border-radius: 8px; border: 1px solid #45475a; display: flex; align-items: center; gap: 6px; font-weight: normal; cursor: pointer; }
  .btn-icon:hover { background: #6c7086; }
  .btn-icon.danger { background: #f38ba8; color: #1e1e2e; border-color: #f38ba8; font-weight: bold;}
  .btn-icon.danger:hover { background: #eba0ac; }

  .folder-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; padding: 12px 14px; background: #45475a; border-radius: 12px; }
  .folder-row .name { font-family: 'Cascadia Code', monospace; font-size: 0.88rem; color: #a6adc8; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .folder-row .name.ok { color: #a6e3a1; }

  .lists-layout { display: flex; gap: 20px; margin-top: 16px; }
  .sidebar { flex: 0 0 260px; display: flex; flex-direction: column; gap: 16px; }
  .file-list { background: #1e1e2e; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 4px; max-height: 400px; overflow-y: auto; }
  .file-btn { background: transparent; color: #a6adc8; text-align: left; padding: 8px 12px; border-radius: 8px; font-family: 'Cascadia Code', monospace; font-size: 0.82rem; border: none; cursor: pointer; transition: all 0.15s; display: flex; justify-content: space-between; align-items: center; }
  .file-btn:hover { background: #313244; color: #cdd6f4; }
  .file-btn.active { background: #cba6f7; color: #1e1e2e; font-weight: bold; }
  .file-btn.user-file { color: #a6e3a1; }
  .file-btn.user-file.active { color: #1e1e2e; }

  .tool-box { background: #1e1e2e; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .tool-box h4 { color: #89b4fa; font-size: 0.9rem; margin-bottom: 4px; }
  .tool-box button { width: 100%; padding: 8px; font-size: 0.85rem; }

  .file-editor { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
  .file-editor h3 { color: #f5c2e7; margin-bottom: 12px; font-family: 'Cascadia Code', monospace; font-size: 1.1rem; }
  .input-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .input-group input[type="text"] { flex: 1; min-width: 200px; background: #1e1e2e; border: 1px solid #585b70; color: #cdd6f4; padding: 8px 12px; border-radius: 8px; font-family: 'Cascadia Code', monospace; font-size: 0.88rem; outline: none; }
  textarea { width: 100%; height: 400px; background: #45475a; border: 1px solid #585b70; border-radius: 12px; padding: 12px; color: #cdd6f4; font-family: 'Cascadia Code', monospace; font-size: 0.88rem; resize: vertical; outline: none; }
  .stats { font-size: 0.82rem; color: #a6adc8; margin-top: 6px; margin-bottom: 10px; }

  .loading-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(30, 30, 46, 0.8); display: none; justify-content: center; align-items: center; font-size: 1.2rem; font-weight: bold; color: #cba6f7; z-index: 10; border-radius: 12px; }

  .log { margin-top: 20px; max-height: 250px; overflow-y: auto; background: #1e1e2e; border-radius: 12px; padding: 14px; font-family: 'Cascadia Code', monospace; font-size: 0.85rem; line-height: 1.5; }
  .log-line { color: #cdd6f4; }
  .log-line.ok { color: #a6e3a1; }
  .log-line.err { color: #f38ba8; }
  .log-line.warn { color: #f9e2af; }

  .versions-list { display: flex; flex-direction: column; gap: 12px; }
  .version-card { background: #45475a; border-radius: 12px; padding: 16px; border: 2px solid transparent; display: flex; flex-direction: column; gap: 8px; }
  .version-card.active { border-color: #a6e3a1; }
  .version-card .head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .version-card .name { font-family: 'Cascadia Code', monospace; font-size: 1.1rem; font-weight: bold; color: #89b4fa; }
  .version-card .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .vbadge { padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; background: #a6e3a1; color: #1e1e2e; }
</style>
</head>
<body>
<div class="container">
  <h1>🔀 Zapret Tools</h1>
  <p class="sub">Нативное приложение · Управление списками и версиями</p>

  <div id="rootBar" class="root-bar">
    <button id="connectRootBtn" title="ПКМ: Создать ярлык в Пуске">📂 Выбрать папку Zapret</button>
    <div class="status" id="rootStatus">Папка не выбрана.</div>
    <div class="quick-actions" id="quickActions" style="display:none;">
      <button id="btnOpenRoot" class="btn-icon">📁 Открыть папку</button>
    </div>
    <div id="activeVersionBadge" class="badge" style="display:none;"></div>
    <button id="btnAutostart" class="btn-icon" style="margin-left:10px;">🚀 Автозапуск: ВЫКЛ</button>
  </div>

  <div id="runningBar" class="running-bar">
    <div class="status" id="runningStatus">Проверка winws.exe...</div>
    <button id="btnOpenRunning" class="btn-icon" style="background:#89b4fa; color:#1e1e2e;">📂 Папка запущенной версии</button>
  </div>

  <div class="running-bar" style="border-color: #f9e2af;">
    <div class="status"><strong>Управление службой:</strong> Выберите стратегию и нажмите Установить</div>
    <div class="quick-actions">
      <select id="strategySelect" style="background:#1e1e2e; color:#cdd6f4; border:1px solid #585b70; border-radius:8px; padding:6px; font-size:0.85rem; max-width:200px;">
          <option value="">-- Стратегия --</option>
      </select>
      <button id="btnSrvInstall" class="btn-icon">⚙️ Установить</button>
      <button id="btnSrvStart" class="btn-icon" style="background:#a6e3a1; color:#1e1e2e;">▶️ Старт</button>
      <button id="btnSrvStop" class="btn-icon danger">⏹️ Стоп</button>
      <button id="btnSrvRemove" class="btn-icon danger">🗑️ Удалить</button>
    </div>
  </div>

  <div class="filter-bar" style="display:none;" id="filterBar">
    <div class="status" style="display:flex; gap:15px; align-items:center;">
      <strong>Фильтры:</strong>
      <label style="cursor:pointer; display:flex; align-items:center; gap:6px;"><input type="checkbox" id="toggleGame" style="accent-color:#a6e3a1; width:18px; height:18px;"> 🎮 Game Filter</label>
      <label style="cursor:pointer; display:flex; align-items:center; gap:6px;"><input type="checkbox" id="toggleIpset" style="accent-color:#a6e3a1; width:18px; height:18px;"> 🛡️ IPSet Filter</label>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="lists">📋 Списки</button>
    <button class="tab" data-tab="import">📥 Импорт</button>
    <button class="tab" data-tab="versions">🔄 Версии</button>
  </div>

  <!-- Вкладка СПИСКИ -->
  <div id="tab-lists" class="tab-content active">
    <div id="listsContent" style="display:none;">
      <div class="folder-row">
        <span class="name">Активная версия:</span><span class="name ok" id="listsActiveVersion">—</span>
      </div>
      <div class="lists-layout">
        <div class="sidebar">
          <div class="file-list" id="fileList"></div>
          <div class="tool-box">
            <h4>🌐 Обновление (GitHub)</h4>
            <button id="updateZapretBtn" class="secondary" style="background:#89b4fa; color:#1e1e2e;">📥 Проверить и обновить</button>
          </div>
        </div>
        <div class="file-editor">
          <div id="fileLoading" class="loading-overlay">⏳ Загрузка файла...</div>
          <h3 id="currentFileName">Выберите файл</h3>
          
          <div class="input-group" style="margin-bottom:8px;">
            <input type="text" id="searchInput" placeholder="🔍 Поиск по файлу..." style="flex:1; border-color:#cba6f7;">
            <button id="searchBtn" class="secondary" style="padding:8px 12px;">Найти</button>
          </div>

          <div class="input-group">
            <input type="text" id="quickInput" placeholder="Введите домен или IP...">
            <button id="quickAddBtn">➕ Добавить</button>
          </div>
          
          <textarea id="fileContent" placeholder="Содержимое файла..."></textarea>
          <div class="stats" id="fileStats">Строк: 0</div>
          
          <button id="validateBtn" class="secondary" style="margin-bottom: 8px;">🔍 Проверить ошибки</button>
          <button id="saveFileBtn" class="big">💾 Сохранить файл</button>
          
          <div id="fileLog" class="log" style="margin-top:12px; max-height:100px;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Вкладка ИМПОРТ -->
  <div id="tab-import" class="tab-content">
    <div class="folder-row"><button id="pickOld">📂 Старая папка</button><span id="oldName" class="name">не выбрана</span></div>
    <div class="folder-row"><button id="pickNew">📂 Новая папка</button><span id="newName" class="name">не выбрана</span></div>
    <button id="mergeBtn" class="big" disabled>🚀 Объединить папки (Merge)</button>
    <div id="log" class="log"></div>
  </div>

  <!-- Вкладка ВЕРСИИ -->
  <div id="tab-versions" class="tab-content">
    <div style="margin-bottom: 16px;">
      <button id="scanVersionsBtn">🔍 Сканировать версии</button>
    </div>
    <div class="versions-list" id="versionsList"></div>
    <div id="versionsLog" class="log"></div>
  </div>
</div>

<script>
const { invoke } = window.__TAURI__.core;
const { open } = window.__TAURI__.dialog;
const { enable, disable, isEnabled } = window.__TAURI__.autostart;

function $id(id) { return document.getElementById(id); }
function logTo(el, msg, cls) {
  if (!el) return;
  const d = document.createElement('div');
  d.className = 'log-line ' + (cls || '');
  d.textContent = msg;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}

let state = { rootPath: null, activeVersion: null, versions: [], currentListFile: null, runningWinwsPath: null };

(async function init() {
  // Автозапуск статус
  const autoStart = await isEnabled();
  $id('btnAutostart').textContent = autoStart ? '🚀 Автозапуск: ВКЛ' : '🚀 Автозапуск: ВЫКЛ';
  $id('btnAutostart').style.background = autoStart ? '#a6e3a1' : '#585b70';
  $id('btnAutostart').style.color = autoStart ? '#1e1e2e' : '#cdd6f4';

  const config = await invoke('get_config');
  if (config.root_path) {
    state.rootPath = config.root_path;
    $id('rootStatus').innerHTML = `Папка: <strong>${state.rootPath}</strong>`;
    $id('rootBar').classList.add('connected');
    $id('quickActions').style.display = 'flex';
    $id('connectRootBtn').textContent = '📂 Сменить папку';
    $id('filterBar').style.display = 'flex';
    
    await scanVersions(config.active_version);
    
    const runningPath = await invoke('find_running_winws');
    if (runningPath && runningPath.toLowerCase().includes('\\bin\\winws.exe')) {
        let rootDir = runningPath.substring(0, runningPath.lastIndexOf('\\'));
        rootDir = rootDir.substring(0, rootDir.lastIndexOf('\\'));
        const runningVersion = state.versions.find(v => v.path.toLowerCase() === rootDir.toLowerCase());
        if (runningVersion) {
            state.activeVersion = runningVersion;
            $id('activeVersionBadge').style.display = '';
            $id('activeVersionBadge').textContent = '✓ ' + state.activeVersion.name + ' (Запущена)';
            await invoke('save_config', { config: { root_path: state.rootPath, active_version: state.activeVersion.name } });
            loadListsTab();
        }
    }
  }
  await checkRunning();
})();

$id('btnAutostart').onclick = async () => {
  const autoStart = await isEnabled();
  if (autoStart) { await disable(); $id('btnAutostart').textContent = '🚀 Автозапуск: ВЫКЛ'; $id('btnAutostart').style.background = '#585b70'; }
  else { await enable(); $id('btnAutostart').textContent = '🚀 Автозапуск: ВКЛ'; $id('btnAutostart').style.background = '#a6e3a1'; $id('btnAutostart').style.color = '#1e1e2e'; }
};

$id('connectRootBtn').onclick = async () => {
  const selected = await open({ directory: true, multiple: false, title: 'Выберите папку Zapret' });
  if (selected) {
    state.rootPath = selected;
    $id('rootStatus').innerHTML = `Папка: <strong>${selected}</strong>`;
    $id('rootBar').classList.add('connected');
    $id('quickActions').style.display = 'flex';
    $id('connectRootBtn').textContent = '📂 Сменить папку';
    $id('filterBar').style.display = 'flex';
    await scanVersions(null);
  }
};

$id('connectRootBtn').addEventListener('contextmenu', async (e) => {
    e.preventDefault();
    if (confirm('Добавить ярлык "Zapret Tools" в меню Пуск?')) {
        await invoke('create_start_menu_shortcut');
        alert('Ярлык создан! Ищите в меню Пуск.');
    }
});

async function scanVersions(preferredActive) {
  if (!state.rootPath) return;
  state.versions = await invoke('scan_versions', { basePath: state.rootPath });
  if (preferredActive) state.activeVersion = state.versions.find(v => v.name === preferredActive) || state.versions[0];
  else if (!state.activeVersion && state.versions.length > 0) state.activeVersion = state.versions[0];

  if (state.activeVersion) {
    $id('activeVersionBadge').style.display = '';
    $id('activeVersionBadge').textContent = '✓ ' + state.activeVersion.name;
    $id('listsContent').style.display = 'block';
    await invoke('save_config', { config: { root_path: state.rootPath, active_version: state.activeVersion.name } });
    
    // Обновляем фильтры и стратегии
    const gameStatus = await invoke('get_game_filter_status', { versionPath: state.activeVersion.path });
    const ipsetStatus = await invoke('get_ipset_filter_status', { versionPath: state.activeVersion.path });
    $id('toggleGame').checked = gameStatus;
    $id('toggleIpset').checked = ipsetStatus;

    const select = $id('strategySelect');
    select.innerHTML = '<option value="">-- Стратегия --</option>';
    const strategies = await invoke('list_strategies', { versionPath: state.activeVersion.path });
    strategies.forEach(s => { const opt = document.createElement('option'); opt.value = s; opt.textContent = s; select.appendChild(opt); });

    loadListsTab();
  }
  renderVersions();
}

async function checkRunning() {
  state.runningWinwsPath = await invoke('find_running_winws');
  if (state.runningWinwsPath) {
    if (state.runningWinwsPath === "Служба запущена (нет прав для чтения пути)") {
        $id('runningStatus').innerHTML = `✅ Служба zapret запущена`;
    } else {
        $id('runningStatus').innerHTML = `✅ winws.exe запущен`;
    }
    if (state.activeVersion && state.runningWinwsPath.toLowerCase().includes(state.activeVersion.name.toLowerCase())) {
        $id('activeVersionBadge').textContent = '✓ ' + state.activeVersion.name + ' (Запущена)';
    }
  } else {
    $id('runningStatus').textContent = '⏸ winws.exe не запущен.';
    if (state.activeVersion) $id('activeVersionBadge').textContent = '✓ ' + state.activeVersion.name;
  }
}

$id('btnOpenRoot').onclick = () => { if (state.rootPath) invoke('open_folder', { path: state.rootPath }); };
$id('btnOpenRunning').onclick = () => {
  if (state.runningWinwsPath && state.runningWinwsPath.includes('\\bin\\winws.exe')) {
    let dir = state.runningWinwsPath.substring(0, state.runningWinwsPath.lastIndexOf('\\'));
    if (dir.toLowerCase().endsWith('\\bin')) dir = dir.substring(0, dir.lastIndexOf('\\'));
    invoke('open_folder', { path: dir });
  } else alert('Не удалось определить путь к запущенной версии.');
};

['btnSrvStart', 'btnSrvStop', 'btnSrvRemove'].forEach((id, i) => {
  const btn = $id(id);
  if (!btn) return;
  const actions = ['start', 'stop', 'remove'];
  btn.onclick = async () => {
    if (!state.activeVersion) return alert('Выберите версию!');
    if (i === 2 && !confirm('Удалить службу?')) return;
    try {
      await invoke('manage_service', { versionPath: state.activeVersion.path, action: actions[i] });
      logTo($id('versionsLog'), `Команда [${actions[i]}] отправлена.`, 'ok');
      setTimeout(checkRunning, 2000);
    } catch(e) { alert(e); }
  };
});

$id('btnSrvInstall').onclick = async () => {
  const strat = $id('strategySelect').value;
  if (!strat) return alert('Сначала выберите стратегию из списка!');
  try {
    await invoke('install_strategy', { versionPath: state.activeVersion.path, strategyName: strat });
    logTo($id('versionsLog'), `Установка стратегии ${strat}...`, 'ok');
    setTimeout(checkRunning, 3000);
  } catch(e) { alert('Ошибка: ' + e); }
};

$id('toggleGame').onchange = async (e) => {
  if (!state.activeVersion) return;
  await invoke('toggle_game_filter', { versionPath: state.activeVersion.path, enable: e.target.checked });
  alert('Game Filter ' + (e.target.checked ? 'включен' : 'выключен') + '. Перезапустите службу.');
};

$id('toggleIpset').onchange = async (e) => {
  if (!state.activeVersion) return;
  await invoke('toggle_ipset_filter', { versionPath: state.activeVersion.path, enable: e.target.checked });
  await selectListFile(state.currentListFile);
  alert('IPSet ' + (e.target.checked ? 'включен' : 'выключен') + '. Перезапустите службу.');
};

async function loadListsTab() {
  if (!state.activeVersion) return;
  $id('listsActiveVersion').textContent = state.activeVersion.name;
  try {
    const files = await invoke('read_list_files', { versionPath: state.activeVersion.path });
    $id('fileList').innerHTML = files.map(f => {
      const isU = f.includes('-user');
      return `<button class="file-btn ${f === state.currentListFile ? 'active' : ''} ${isU ? 'user-file' : ''}" data-file="${f}">${f}</button>`;
    }).join('');

    $id('fileList').querySelectorAll('.file-btn').forEach(btn => {
      btn.onclick = () => {
        $id('fileList').querySelectorAll('.file-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectListFile(btn.dataset.file);
      };
    });
    if (!state.currentListFile && files.length > 0) selectListFile(files[0]);
  } catch (e) { logTo($id('fileLog'), 'Ошибка списка: ' + e, 'err'); }
}

async function selectListFile(filename) {
  state.currentListFile = filename;
  $id('currentFileName').textContent = filename;
  if ($id('fileLog')) $id('fileLog').innerHTML = '';
  const spinner = $id('fileLoading');
  if (spinner) spinner.style.display = 'flex';
  const textarea = $id('fileContent');
  if (textarea) textarea.value = ''; 
  
  setTimeout(async () => {
    try {
      const content = await invoke('read_list_file', { versionPath: state.activeVersion.path, fileName: filename });
      if (textarea) textarea.value = content;
      updateFileStats();
    } catch (e) { if (textarea) textarea.value = ''; } 
    finally { if (spinner) spinner.style.display = 'none'; }
  }, 50);
}

let statsTimeout;
function updateFileStats() {
  clearTimeout(statsTimeout);
  statsTimeout = setTimeout(() => {
    const textarea = $id('fileContent');
    if (!textarea) return;
    const text = textarea.value;
    const linesCount = text.split(/\r?\n/).length;
    let nonEmpty = 0;
    if (text.length > 0) { const matches = text.match(/\S+/g); nonEmpty = matches ? matches.length : 0; }
    const statsEl = $id('fileStats');
    if (statsEl) statsEl.textContent = `Строк: ${nonEmpty} (всего: ${linesCount})`;
  }, 300); 
}

const fileContentArea = $id('fileContent');
if (fileContentArea) fileContentArea.addEventListener('input', updateFileStats);

$id('searchBtn').onclick = () => {
  const query = $id('searchInput').value.trim();
  const textarea = $id('fileContent');
  if (!query) return;
  const text = textarea.value;
  const index = text.toLowerCase().indexOf(query.toLowerCase());
  if (index !== -1) {
    textarea.focus();
    textarea.setSelectionRange(index, index + query.length);
    const linesBefore = text.substring(0, index).split('\n').length;
    textarea.scrollTop = (linesBefore * 18) - 50;
  } else { alert('Не найдено!'); }
};

$id('validateBtn').onclick = async () => {
  if (!state.currentListFile) return;
  const content = $id('fileContent').value;
  const isIp = state.currentListFile.toLowerCase().includes('ipset');
  const errors = await invoke('validate_list', { content, isIpList: isIp });
  if (errors.length === 0) logTo($id('fileLog'), '✅ Ошибок не найдено!', 'ok');
  else {
    logTo($id('fileLog'), `⚠️ Найдено ошибок: ${errors.length}`, 'err');
    errors.slice(0, 10).forEach(err => logTo($id('fileLog'), err, 'warn'));
  }
};

const updateZapretBtn = $id('updateZapretBtn');
if (updateZapretBtn) {
  updateZapretBtn.onclick = async () => {
    if (!state.activeVersion) return alert('Сначала выберите версию!');
    updateZapretBtn.disabled = true; updateZapretBtn.textContent = '⏳ Проверка версии...';
    try {
      const [local, remote] = await invoke('check_zapret_version', { versionPath: state.activeVersion.path });
      if (local === remote) { alert(`✅ У вас самая свежая версия: ${local}`); return; }
      if (!confirm(`Найдена новая версия!\nУ вас: ${local}\nДоступна: ${remote}\n\nСкачать и перенести настройки?`)) return;
      
      const oldName = state.activeVersion.name;
      const oldPath = state.activeVersion.path;
      updateZapretBtn.textContent = '⏳ Скачивание...';
      
      const newDirName = await invoke('download_zapret', { rootPath: state.rootPath, activeName: oldName, newVersion: remote });
      await scanVersions(newDirName);
      
      if (confirm(`✅ Обновлено до ${remote}!\nУдалить старую версию (${oldName})?`)) {
        await invoke('delete_version', { versionPath: oldPath });
        await scanVersions(newDirName);
      }
    } catch(e) { alert('Ошибка: ' + e); } 
    finally { updateZapretBtn.disabled = false; updateZapretBtn.textContent = '📥 Проверить и обновить'; }
  };
}

const saveFileBtn = $id('saveFileBtn');
if (saveFileBtn) {
  saveFileBtn.onclick = async () => {
    if (!state.currentListFile) return;
    try {
      await invoke('write_list_file', { versionPath: state.activeVersion.path, fileName: state.currentListFile, content: $id('fileContent').value });
      logTo($id('fileLog'), 'Сохранено!', 'ok');
    } catch(e) { logTo($id('fileLog'), 'Ошибка: ' + e, 'err'); }
  };
}
// Обработчик кнопки "Сканировать версии"
const scanVersionsBtn = $id('scanVersionsBtn');
if (scanVersionsBtn) {
  scanVersionsBtn.onclick = async () => {
    if (!state.rootPath) return alert('Сначала выберите папку Zapret!');
    
    scanVersionsBtn.disabled = true;
    scanVersionsBtn.textContent = '⏳ Сканирование...';
    
    try {
      // Пересканируем папку, сохраняя текущую активную версию (если она есть)
      await scanVersions(state.activeVersion ? state.activeVersion.name : null);
    } catch(e) {
      alert('Ошибка сканирования: ' + e);
    } finally {
      scanVersionsBtn.disabled = false;
      scanVersionsBtn.textContent = '🔍 Сканировать версии';
    }
  };
}
const quickAddBtn = $id('quickAddBtn');
if (quickAddBtn) {
  quickAddBtn.onclick = () => {
    const input = $id('quickInput');
    const raw = input.value.trim();
    if (!raw) return;
    const textarea = $id('fileContent');
    let lines = textarea.value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    const seen = new Set(lines.map(s => s.toLowerCase()));
    let added = 0;
    raw.split(/[\s,;]+/).forEach(item => {
      if (!seen.has(item.toLowerCase())) { seen.add(item.toLowerCase()); lines.push(item); added++; }
    });
    lines.sort();
    textarea.value = lines.join('\n') + '\n';
    input.value = '';
    updateFileStats();
    logTo($id('fileLog'), `Добавлено: ${added}`, 'ok');
  };
}

let oldDir = null, newDir = null;
$id('pickOld').onclick = async () => { oldDir = await open({ directory: true }); if (oldDir) $id('oldName').textContent = oldDir; $id('mergeBtn').disabled = !(oldDir && newDir); };
$id('pickNew').onclick = async () => { newDir = await open({ directory: true }); if (newDir) $id('newName').textContent = newDir; $id('mergeBtn').disabled = !(oldDir && newDir); };
$id('mergeBtn').onclick = async () => { if(!oldDir || !newDir) return; await invoke('merge_folders', { src: oldDir, dst: newDir }); logTo($id('log'), 'Объединено!', 'ok'); };

function renderVersions() {
  if (!$id('versionsList')) return;
  $id('versionsList').innerHTML = state.versions.map(v => `
    <div class="version-card ${state.activeVersion?.name === v.name ? 'active' : ''}">
      <div class="head"><span class="name">${v.name}</span>${state.activeVersion?.name === v.name ? '<span class="vbadge">АКТИВНАЯ</span>' : ''}</div>
      <div class="actions">${state.activeVersion?.name !== v.name ? `<button class="small" onclick="window.activate('${v.name}')">Сделать активной</button>` : ''}</div>
    </div>
  `).join('');
}

window.activate = async (name) => { state.activeVersion = state.versions.find(v => v.name === name); await scanVersions(name); };

document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    tab.classList.add('active');
    $id('tab-' + tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'lists') loadListsTab();
  };
});

// --- DRAG & DROP ---
window.addEventListener('tauri://drag-drop', async (event) => {
    const paths = event.payload.paths;
    if (!paths || paths.length === 0) return;
    const txtPath = paths.find(p => p.toLowerCase().endsWith('.txt'));
    if (!txtPath) return;
    if (!state.activeVersion || !state.currentListFile) return alert('Выберите файл в левой панели, куда добавить список!');
    
    try {
        const fileContent = await invoke('read_external_file', { path: txtPath });
        const textarea = $id('fileContent');
        let currentLines = textarea.value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
        const seen = new Set(currentLines.map(s => s.toLowerCase()));
        let added = 0;
        fileContent.split(/\r?\n/).forEach(line => {
            const trimmed = line.trim();
            if (trimmed && !seen.has(trimmed.toLowerCase())) {
                seen.add(trimmed.toLowerCase());
                currentLines.push(trimmed);
                added++;
            }
        });
        currentLines.sort();
        textarea.value = currentLines.join('\n') + '\n';
        updateFileStats();
        logTo($id('fileLog'), `📥 Из файла добавлено: ${added}`, 'ok');
    } catch(e) { alert('Ошибка чтения: ' + e); }
});
</script>
</body>
</html>
